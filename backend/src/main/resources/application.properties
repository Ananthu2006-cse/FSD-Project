spring.application.name=warehouse-inventory
server.port=8080

# Database Configuration (Defaults to embedded file persistence; can be overridden with MySQL via DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/inventory_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (Supports Environment Variables with Dev Default)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
